[tool.poetry]
name = "pdf-converter"
version = "0.1.0"
description = "Application for converting Word and PDF files for desktop."
authors = ["vv.popov <ladoshkatv777@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.11"
pypdf2 = "^3.0.1"
pydantic-settings = "^2.10.1"
aiogram = "~2.25.1"
alembic = "^1.16.5"
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
